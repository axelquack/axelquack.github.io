<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Art Gallery — Axel Quack</title>
    <meta
      name="description"
      content="WebXR art gallery of NFT and other artwork by Axel Quack."
    />
    <meta name="theme-color" content="#fafafa" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:opsz,wght@14..32,400;14..32,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="scene-root"></div>

    <header class="hud hud-top">
      <div>
        <p class="kicker">NFT · other work</p>
        <h1>Art Gallery</h1>
      </div>
      <a class="link" href="https://www.axelquack.de">axelquack.de</a>
    </header>

    <nav class="hud hud-filters" aria-label="Filter works">
      <button type="button" class="text-btn is-active" data-filter="all" aria-pressed="true">
        All
      </button>
      <button type="button" class="text-btn" data-filter="nft" aria-pressed="false">
        NFT
      </button>
      <button type="button" class="text-btn" data-filter="other" aria-pressed="false">
        Other
      </button>
    </nav>

    <section class="catalog" id="catalog" hidden tabindex="-1" aria-label="Works">
      <div class="catalog-list" id="catalog-list"></div>
    </section>

    <aside class="hud hud-caption" id="caption" hidden>
      <p class="caption-title" id="caption-title"></p>
      <p class="caption-meta" id="caption-meta"></p>
      <p>
        <a class="link" id="caption-link" hidden target="_blank" rel="noopener"></a>
      </p>
    </aside>

    <div class="hud hud-bottom">
      <p class="hud-hint">Click to look · WASD to walk</p>
      <div class="hud-controls">
        <div class="hud-audio">
          <button
            type="button"
            class="icon-btn"
            id="audio-toggle"
            aria-label="Play soundtrack"
            aria-pressed="false"
          >
            <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M8 5.8v12.4L19 12z" />
            </svg>
            <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="7.4" y="5.8" width="2.4" height="12.4" fill="currentColor" />
              <rect x="14.2" y="5.8" width="2.4" height="12.4" fill="currentColor" />
            </svg>
          </button>
          <p class="audio-title" id="audio-title"></p>
        </div>
        <div class="hud-tools">
          <div
            class="stick"
            id="move-stick"
            role="application"
            aria-label="Walk"
            aria-hidden="true"
          >
            <span class="stick-ring" aria-hidden="true"></span>
            <span class="stick-knob" aria-hidden="true"></span>
          </div>
          <button
            type="button"
            class="icon-btn"
            id="fullscreen-toggle"
            aria-label="Enter fullscreen"
            aria-pressed="false"
          >
            <svg class="icon icon-expand" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="square"
                d="M5 9V5h4M19 9V5h-4M5 15v4h4M19 15v4h-4"
              />
            </svg>
            <svg class="icon icon-collapse" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="square"
                d="M9 5v4H5M15 5v4h4M9 19v-4H5M15 19v-4h4"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
