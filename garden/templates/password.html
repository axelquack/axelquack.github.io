<!DOCTYPE html>
<html class="staticrypt-html" lang="en">
  <head>
    <meta charset="utf-8" />
    <title>/*[|template_title|]*/0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#fafafa" />
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="pragma" content="no-cache" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:opsz,wght@14..32,400;14..32,500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f7f7f7;
        --ink: #0a0a0a;
        --muted: #8a8a8a;
        --line: rgba(10, 10, 10, 0.12);
        --font-display: "Instrument Serif", Georgia, "Times New Roman", serif;
        --font-ui: "Inter", system-ui, sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, monospace;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      html, body, .staticrypt-html, .staticrypt-body {
        height: 100%;
        margin: 0;
      }
      .staticrypt-content {
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        min-height: 100%;
        padding: clamp(1.5rem, 5vw, 4rem);
        display: flex;
        align-items: center;
      }
      form { width: min(22rem, 100%); }
      .kicker {
        margin: 0 0 0.65rem;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .staticrypt-title {
        font-family: var(--font-display);
        font-size: clamp(2.1rem, 4.8vw, 3.2rem);
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin: 0 0 1.5rem;
      }
      .staticrypt-instructions p { margin: 0; }
      .staticrypt-password-container { position: relative; margin: 0 0 1rem; }
      .staticrypt-form input[type="password"],
      input[type="text"] {
        width: 100%;
        font: inherit;
        padding: 0.55rem 2.2rem 0.55rem 0;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: inherit;
        box-sizing: border-box;
        outline: 0;
        border-radius: 0;
      }
      .staticrypt-form input[type="password"]:focus,
      input[type="text"]:focus {
        border-bottom-color: var(--ink);
      }
      .staticrypt-toggle-password-visibility {
        cursor: pointer;
        height: 18px;
        width: 18px;
        opacity: 0.5;
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
      }
      label.staticrypt-remember {
        display: flex;
        align-items: center;
        margin: 0 0 1.25rem;
        gap: 0.6rem;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .staticrypt-decrypt-button {
        font: inherit;
        font-weight: 500;
        color: var(--muted);
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      .staticrypt-decrypt-button:hover,
      .staticrypt-decrypt-button:focus-visible {
        color: var(--ink);
        outline: 0;
      }
      .hidden { display: none !important; }
      .staticrypt-spinner-container {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
      }
      .staticrypt-spinner {
        display: inline-block;
        width: 1.2rem;
        height: 1.2rem;
        border: 1px solid var(--line);
        border-right-color: transparent;
        border-radius: 50%;
        animation: spinner-border 0.75s linear infinite;
      }
      @keyframes spinner-border {
        100% { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .staticrypt-spinner { animation: none; }
      }
    </style>
  </head>
  <body class="staticrypt-body">
    <div id="staticrypt_loading" class="staticrypt-spinner-container">
      <div class="staticrypt-spinner"></div>
    </div>
    <div id="staticrypt_content" class="staticrypt-content hidden">
      <div class="wrap">
        <div class="staticrypt-form">
          <div class="staticrypt-instructions">
            <p class="kicker">Garden</p>
            <p class="staticrypt-title">/*[|template_title|]*/0</p>
            <p>/*[|template_instructions|]*/0</p>
          </div>
          <form id="staticrypt-form" action="#" method="post">
            <div class="staticrypt-password-container">
              <input
                id="staticrypt-password"
                type="password"
                name="password"
                placeholder="/*[|template_placeholder|]*/0"
                autofocus
              />
              <img
                class="staticrypt-toggle-password-visibility"
                alt="/*[|template_toggle_show|]*/0"
                title="/*[|template_toggle_show|]*/0"
                src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NDAgNTEyIj48cGF0aCBmaWxsPSIjMGEwYTBhIiBkPSJNMzguOCA1LjFDMjguNC0zLjEgMTMuMy0xLjIgNS4xIDkuMlMtMS4yIDM0LjcgOS4yIDQyLjlsNTkyIDQ2NGMxMC40IDguMiAyNS41IDYuMyAzMy43LTQuMXM2LjMtMjUuNS00LjEtMzMuN0w1MjUuNiAzODYuN2MzOS42LTQwLjYgNjYuNC04Ni4xIDc5LjktMTE4LjRjMy4zLTcuOSAzLjMtMTYuNyAwLTI0LjZjLTE0LjktMzUuNy00Ni4yLTg3LjctOTMtMTMxLjFDNDY1LjUgNjguOCA0MDAuOCAzMiAzMjAgMzJjLTY4LjIgMC0xMjUgMjYuMy0xNjkuMyA2MC44TDM4LjggNS4xek0yMjMuMSAxNDkuNUMyNDguNiAxMjYuMiAyODIuNyAxMTIgMzIwIDExMmM3OS41IDAgMTQ0IDY0LjUgMTQ0IDE0NGMwIDI0LjktNi4zIDQ4LjMtMTcuNCA2OC43TDQwOCAyOTQuNWM4LjQtMTkuMyAxMC42LTQxLjQgNC44LTYzLjNjLTExLjEtNDEuNS00Ny44LTY5LjQtODguNi03MS4xYy01LjgtLjItOS4yIDYuMS03LjQgMTEuN2MyLjEgNi40IDMuMyAxMy4yIDMuMyAyMC4zYzAgMTAuMi0yLjQgMTkuOC02LjYgMjguM2wtOTAuMy03MC44ek0zNzMgMzg5LjljLTE2LjQgNi41LTM0LjMgMTAuMS01MyAxMC4xYy03OS41IDAtMTQ0LTY0LjUtMTQ0LTE0NGMwLTYuOSAuNS0xMy42IDEuNC0yMC4yTDgzLjEgMTYxLjVDNjAuMyAxOTEuMiA0NCAyMjAuOCAzNC41IDI0My43Yy0zLjMgNy45LTMuMyAxNi43IDAgMjQuNmMxNC45IDM1LjcgNDYuMiA4Ny43IDkzIDEzMS4xQzE3NC41IDQ0My4yIDIzOS4yIDQ4MCAzMjAgNDgwYzQ3LjggMCA4OS45LTEyLjkgMTI2LjItMzIuNUwzNzMgMzg5Ljl6Ii8+PC9zdmc+"
              />
            </div>
            <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
              <input id="staticrypt-remember" type="checkbox" name="remember" />
              /*[|template_remember|]*/0
            </label>
            <input type="submit" class="staticrypt-decrypt-button" value="/*[|template_button|]*/0" />
          </form>
        </div>
      </div>
    </div>
    <script>
      const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
      const templateError = "/*[|template_error|]*/0",
        templateToggleAltShow = "/*[|template_toggle_show|]*/0",
        templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
        isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
        staticryptConfig = /*[|staticrypt_config|]*/ 0;

      const templateConfig = {
        rememberExpirationKey: "staticrypt_expiration",
        rememberPassphraseKey: "staticrypt_passphrase",
        replaceHtmlCallback: null,
        clearLocalStorageCallback: null,
      };

      const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

      window.onload = async function () {
        const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
        if (!isSuccessful) {
          document.getElementById("staticrypt_loading").classList.add("hidden");
          document.getElementById("staticrypt_content").classList.remove("hidden");
          document.getElementById("staticrypt-password").focus();
          if (isRememberEnabled) {
            document.getElementById("staticrypt-remember-label").classList.remove("hidden");
          }
        }
      };

      const toggleIcon = document.querySelector(".staticrypt-toggle-password-visibility");
      const imgSrcEyeClosed = toggleIcon.src;
      const imgSrcEyeOpened =
        "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1NzYgNTEyIj48cGF0aCBmaWxsPSIjMGEwYTBhIiBkPSJNMjg4IDMyYy04MC44IDAtMTQ1LjUgMzYuOC0xOTIuNiA4MC42QzQ4LjYgMTU2IDE3LjMgMjA4IDIuNSAyNDMuN2MtMy4zIDcuOS0zLjMgMTYuNyAwIDI0LjZDMTcuMyAzMDQgNDguNiAzNTYgOTUuNCAzOTkuNEMxNDIuNSA0NDMuMiAyMDcuMiA0ODAgMjg4IDQ4MHMxNDUuNS0zNi44IDE5Mi42LTgwLjZjNDYuOC00My41IDc4LjEtOTUuNCA5My0xMzEuMWMzLjMtNy45IDMuMy0xNi43IDAtMjQuNmMtMTQuOS0zNS43LTQ2LjItODcuNy05My0xMzEuMUM0MzMuNSA2OC44IDM2OC44IDMyIDI4OCAzMnptLTE0NCAyMjRhMTQ0IDE0NCAwIDEgMSAyODggMCAxNDQgMTQ0IDAgMSAxIC0yODggMHoiLz48L3N2Zz4=";
      toggleIcon.addEventListener("click", function () {
        const passwordInput = document.getElementById("staticrypt-password");
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          toggleIcon.src = imgSrcEyeOpened;
          toggleIcon.alt = templateToggleAltHide;
          toggleIcon.title = templateToggleAltHide;
        } else {
          passwordInput.type = "password";
          toggleIcon.src = imgSrcEyeClosed;
          toggleIcon.alt = templateToggleAltShow;
          toggleIcon.title = templateToggleAltShow;
        }
      });

      document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const password = document.getElementById("staticrypt-password").value,
          isRememberChecked = document.getElementById("staticrypt-remember").checked;
        const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
        if (!isSuccessful) {
          alert(templateError);
        }
      });
    </script>
  </body>
</html>
