name: Deploy Art Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gallery
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:gallery
      - run: touch dist-gallery/.nojekyll
      - name: Publish dist-gallery to axelquack/gallery (gh-pages)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          deploy_key: ${{ secrets.GALLERY_DEPLOY_KEY }}
          external_repository: axelquack/gallery
          publish_branch: gh-pages
          publish_dir: ./dist-gallery
          force_orphan: true
          keep_files: false
          enable_jekyll: false
          full_commit_message: Publish Art Gallery
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
