name: Deploy Garden

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-garden
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Encrypt garden
        env:
          GARDEN_SITE_PASSWORD: ${{ secrets.GARDEN_SITE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${GARDEN_SITE_PASSWORD}"
          node garden/scripts/encrypt.mjs --encrypt
      - name: Publish dist-garden-public to axelquack/garden (gh-pages)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          deploy_key: ${{ secrets.GARDEN_DEPLOY_KEY }}
          external_repository: axelquack/garden
          publish_branch: gh-pages
          publish_dir: ./dist-garden-public
          force_orphan: true
          keep_files: false
          enable_jekyll: false
          full_commit_message: Publish encrypted garden
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
